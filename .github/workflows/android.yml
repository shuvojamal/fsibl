# Builds the Tradebot Desk Android app (a wrapper around dashboard/index.html)
# and publishes the APK as the GitHub release "dashboard-latest".
name: android-app

on:
  push:
    branches: [main]
    paths: ["dashboard/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Bundle the dashboard page into the app
        run: cp dashboard/index.html android/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TradebotDesk.apk
          gh release delete dashboard-latest --yes --cleanup-tag || true
          gh release create dashboard-latest TradebotDesk.apk \
            --title "Tradebot Desk app (build ${{ github.run_number }})" \
            --notes "Android app for watching and controlling the demo bot. Download TradebotDesk.apk on your phone and open it to install." \
            --target "${{ github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: TradebotDesk-apk
          path: TradebotDesk.apk
