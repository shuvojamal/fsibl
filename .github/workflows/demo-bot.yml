# Runs the opportunity bot once a day on the OKX demo account, right after
# the daily candle closes, and commits its state back so positions carry
# over between runs. Off until the repo owner opts in:
#   1. Settings > Secrets and variables > Actions > Secrets:
#        OKX_API_KEY, OKX_API_SECRET, OKX_PASSPHRASE   (demo-trading key)
#   2. Same page > Variables: TRADEBOT_ENABLED = true
#      Optional variable TRADEBOT_CAPITAL (default 5000): the account size the
#      bot sizes trades for, so demo results match what you'd really trade.
# To stop it: set TRADEBOT_ENABLED to anything else, or disable the workflow.
# Pause from the dashboard app: it creates demo_state/PAUSED (no new entries;
# stops and exits keep running). Resume deletes the file.
name: demo-bot

on:
  schedule:
    - cron: "7 0 * * *"   # 00:07 UTC daily, after the daily candle closes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    if: vars.TRADEBOT_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Read the dashboard's settings and requests
        id: ctl
        env:
          CAPITAL: ${{ vars.TRADEBOT_CAPITAL || '5000' }}
        run: |
          mkdir -p demo_state
          python -m tradebot controls --state-dir demo_state --default-capital "$CAPITAL" > /tmp/ctl.txt
          cat /tmp/ctl.txt
          echo "args=$(sed -n 1p /tmp/ctl.txt)" >> "$GITHUB_OUTPUT"
          echo "gold=$(sed -n 2p /tmp/ctl.txt)" >> "$GITHUB_OUTPUT"
          echo "$(sed -n 3p /tmp/ctl.txt)" >> "$GITHUB_OUTPUT"
          echo "$(sed -n 5p /tmp/ctl.txt)" >> "$GITHUB_OUTPUT"
          echo "$(sed -n 6p /tmp/ctl.txt)" >> "$GITHUB_OUTPUT"

      - name: Pick coins (top 15 by 90-day volume, gold, plus anything still held)
        id: coins
        run: |
          TOP=$(python -m tradebot scan --top 15 --symbols-only)
          HELD=$(python - <<'EOF'
          import json, os
          p = "demo_state/live_state.json"
          if os.path.exists(p):
              pos = json.load(open(p)).get("positions", {})
              print(" ".join(s for s, q in pos.items() if q.get("qty", 0) > 0))
          EOF
          )
          # PAXGUSDT (tokenised gold) is always included: it never makes the top 15
          # by volume, but it diversifies the book (research round 17).
          GOLD=""; [ "${{ steps.ctl.outputs.gold }}" = "gold" ] && GOLD=PAXGUSDT
          SYMS=$(echo $TOP $HELD $GOLD | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "symbols=$SYMS" >> "$GITHUB_OUTPUT"
          echo "trading: $SYMS"

      - name: Run the bot once (OKX demo)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          CAPITAL: ${{ vars.TRADEBOT_CAPITAL || '5000' }}
        # Capital, risk, slots, backstop and limits come from demo_state/settings.json
        # (edited in the app, validated and clamped by `tradebot controls`), falling
        # back to the repo variable TRADEBOT_CAPITAL and the research defaults.
        run: |
          set -o pipefail   # a crash inside `| tee` must fail the step, not pass silently
          if [ -z "$OKX_API_KEY" ]; then echo "OKX secrets not set; nothing to do"; exit 0; fi
          python -u -m tradebot live ${{ steps.coins.outputs.symbols }} \
            --exchange okx --strategy opportunity --interval 1d \
            ${{ steps.ctl.outputs.args }} --no-adopt --state-dir demo_state --once | tee -a demo_state/run.log
          rm -f demo_state/CLOSE demo_state/RESET_HALT   # one-shot requests, now done
          python -m tradebot report ${{ steps.coins.outputs.symbols }} \
            --exchange okx --state-dir demo_state | tee demo_state/report.txt
          python -m tradebot shadow ${{ steps.coins.outputs.symbols }} --state-dir demo_state \
            --max-open ${{ steps.ctl.outputs.max_open }} --min-score ${{ steps.ctl.outputs.min_score }} --ignore-check ${{ steps.ctl.outputs.ignore }} | tee demo_state/shadow.txt || true
          python - <<EOF
          import json, datetime
          from tradebot.control import read_controls
          c = read_controls("demo_state", float("$CAPITAL"))
          c.pop("close"); c.pop("reset_halt"); c.pop("notes")
          json.dump({"time": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC"),
                     "symbols": "${{ steps.coins.outputs.symbols }}".split(), **c},
                    open("demo_state/last_run.json", "w"), indent=2)
          EOF

      - name: Save state
        run: |
          git config user.name "tradebot"
          git config user.email "tradebot@users.noreply.github.com"
          git add -A demo_state
          git diff --cached --quiet || git commit -m "demo-bot: daily run $(date -u +%F)"
          git pull --rebase   # the dashboard may have paused/resumed meanwhile
          git push

      # Last, so the state above is saved either way; a failure turns this run
      # red (ERR in the dashboard app) when the bot's books disagree with themselves.
      - name: Audit state
        run: python -m tradebot audit --state-dir demo_state --max-open ${{ steps.ctl.outputs.max_open }}
