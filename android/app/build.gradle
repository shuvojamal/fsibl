plugins { id "com.android.application" }

android {
    namespace "com.shuvojamal.tradebot"
    compileSdk 34

    defaultConfig {
        applicationId "com.shuvojamal.tradebot"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // A fixed key so each new APK installs as an update over the previous one.
    // It only identifies this personal app; it grants no access to anything.
    signingConfigs {
        release {
            storeFile file("tradebot.keystore")
            storePassword "tradebot-desk"
            keyAlias "tradebot"
            keyPassword "tradebot-desk"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
