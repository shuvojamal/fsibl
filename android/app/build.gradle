plugins { id "com.android.application" }

android {
    namespace "com.shuvojamal.tradebot"
    compileSdk 34

    defaultConfig {
        applicationId "com.shuvojamal.tradebot"
        minSdk 26
        targetSdk 34
        // Builds made outside GitHub Actions set TRADEBOT_BUILD (100 and up);
        // Actions builds use 100 + the run number, so each new APK is an update.
        versionCode((System.getenv("TRADEBOT_BUILD") ?: (((System.getenv("GITHUB_RUN_NUMBER") ?: "0") as int) + 100) as String) as int)
        versionName "1.1." + (System.getenv("TRADEBOT_BUILD") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // A fixed key so each new APK installs as an update over the previous one.
    // It only identifies this personal app; it grants no access to anything.
    signingConfigs {
        release {
            storeFile file("tradebot.keystore")
            storePassword "tradebot-desk"
            keyAlias "tradebot"
            keyPassword "tradebot-desk"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
