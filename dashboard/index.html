<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4fb">
<title>Tradebot Desk</title>
<style>
/* App shell: sticky top bar, one scrolling view per tab, floating tab bar. System fonts only, so nothing loads before first paint. */
:root {
  --bg: #f3f4fb; --surface: #ffffff; --surface-2: #f0f2fa; --line: #e7e9f4; --fg: #111427; --muted: #646b85;
  --accent: #6355f0; --accent-2: #b14cf0; --accent-3: #ff5d8f; --accent-ink: #ffffff;
  --up: #0aa06e; --down: #e5484d; --warn: #c27400; --info: #1f8cff;
  --up-bg: rgba(10, 160, 110, .12); --down-bg: rgba(229, 72, 77, .11); --warn-bg: rgba(255, 170, 0, .16); --accent-bg: rgba(99, 85, 240, .11); --info-bg: rgba(31, 140, 255, .12);
  --grad: linear-gradient(135deg, #5b5cf0 0%, #9b4cf0 55%, #f0508f 100%);
  --grad-up: linear-gradient(135deg, #11b981, #0ea5a4); --grad-down: linear-gradient(135deg, #f43f5e, #f97316);
  --shadow: 0 1px 2px rgba(30, 27, 75, .04), 0 6px 20px rgba(30, 27, 75, .07);
  --shadow-lg: 0 12px 34px rgba(91, 76, 240, .28);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --r: 20px; --ease: cubic-bezier(.2, .8, .2, 1); color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; min-height: 100% }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain }
html, body { overflow-x: clip }   /* the slide-in animation must never widen the page */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(60% 40% at 0% 0%, rgba(99, 85, 240, .14), transparent 70%),
              radial-gradient(50% 35% at 100% 10%, rgba(240, 80, 143, .12), transparent 70%),
              radial-gradient(60% 40% at 50% 100%, rgba(14, 165, 164, .10), transparent 70%) }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" }
.up { color: var(--up) } .down { color: var(--down) } .muted { color: var(--muted) }

/* top bar */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px }
.brand { font-weight: 800; font-size: 19px; letter-spacing: -.02em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent }
.acct { border: 0; background: var(--accent-bg); color: var(--accent); font: 700 12px var(--sans); padding: 6px 11px; border-radius: 999px; cursor: pointer; transition: transform .15s var(--ease) }
.acct::after { content: " ▾"; opacity: .7 }
.acct.real { color: #fff; background: var(--grad-down) }
.choice { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; border: 2px solid transparent; background: var(--surface-2); cursor: pointer; text-align: left; font: inherit; color: var(--fg); width: 100%; transition: transform .15s var(--ease), border-color .2s }
.choice[aria-current="true"] { border-color: var(--accent); background: var(--accent-bg) }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.status i { width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.status.run { background: var(--up-bg); color: var(--up) } .status.pause { background: var(--warn-bg); color: var(--warn) }
.status.halt, .status.err { background: var(--down-bg); color: var(--down) }
.status.run i { box-shadow: 0 0 0 0 currentColor; animation: ping 2s ease-out infinite }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(10, 160, 110, .55) } 80%, 100% { box-shadow: 0 0 0 7px rgba(10, 160, 110, 0) } }
.spacer { flex: 1 }
.icon-btn { width: 40px; height: 40px; border-radius: 14px; border: 0; background: var(--surface); color: var(--accent); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s var(--ease) }
.icon-btn svg { width: 20px; height: 20px }
.icon-btn.spin svg { animation: spin .8s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
.ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 4; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%;
  background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--accent); opacity: 0; transform: translateY(-30px) scale(.6); pointer-events: none }
.ptr svg { width: 20px; height: 20px } .ptr.spin svg { animation: spin .8s linear infinite }

/* views */
main { padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-width: 720px; margin: 0 auto }
.view { display: grid; gap: 14px }
.view > * { min-width: 0 }   /* long single-line text must shrink, not widen the page */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow) }
h2 { font-size: 13px; font-weight: 700; color: var(--muted); margin: 8px 2px 0; letter-spacing: .03em; text-transform: uppercase }

/* hero */
.hero { position: relative; overflow: hidden; padding: 18px 18px 8px }
.hero .label { font-size: 13px; color: var(--muted); font-weight: 600 }
.hero .big { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin-top: 4px }
.hero .delta { display: inline-flex; gap: 8px; align-items: center; margin-top: 8px; font-weight: 700; font-size: 14px }
.badge { padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 700 }
.badge.up { background: var(--up-bg) } .badge.down { background: var(--down-bg) }
.chart { position: relative; margin: 14px -6px 0; height: 140px; touch-action: pan-y }
.chart svg { width: 100%; height: 100%; display: block; overflow: visible }
.scrub { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1.5px dashed var(--muted); pointer-events: none }
.scrub b { position: absolute; top: -2px; transform: translateX(-50%); white-space: nowrap; background: rgba(17, 20, 39, .78); color: #fff; font: 600 12px var(--sans); padding: 4px 8px; border-radius: 8px }
.scrub i { position: absolute; left: -6px; margin-top: -6px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--fg) }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.stat { position: relative; background: var(--surface); border-radius: 16px; padding: 12px; min-width: 0; box-shadow: var(--shadow); overflow: hidden }
.stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c, var(--accent)) }
.stat:nth-child(3n+1) { --c: var(--info) } .stat:nth-child(3n+2) { --c: var(--accent-2) } .stat:nth-child(3n) { --c: var(--accent-3) }
.stat .k { font-size: 12px; color: var(--muted); font-weight: 600 } .stat .v { font-size: 17px; font-weight: 800; margin-top: 2px; overflow-wrap: anywhere }

/* actions */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.btn { position: relative; overflow: hidden; height: 50px; border-radius: 16px; border: 0; font: 700 15px var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface); color: var(--fg); box-shadow: var(--shadow); transition: transform .15s var(--ease), box-shadow .2s, filter .2s }
.btn svg { width: 18px; height: 18px }
.btn.primary { background: var(--grad); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(99, 85, 240, .3) }
.btn.warn { background: linear-gradient(135deg, #ffb020, #ff8a00); color: #fff; box-shadow: 0 6px 18px rgba(255, 150, 0, .25) }
.btn.danger { background: var(--down-bg); color: var(--down) }
.btn:disabled { opacity: .5 }
.btn.sm { height: 40px; font-size: 14px; border-radius: 13px; box-shadow: none; background: var(--surface-2) }
.btn.sm.danger { background: var(--down-bg) }
.btn:active, .icon-btn:active, .acct:active, .choice:active, .tab:active, .item[data-acct-go]:active, [data-goto]:active { transform: scale(.96) }
.rip { position: absolute; border-radius: 50%; background: currentColor; opacity: .18; transform: scale(0); animation: rip .5s ease-out forwards; pointer-events: none }
@keyframes rip { to { transform: scale(2.6); opacity: 0 } }
.pending { font-size: 12px; font-weight: 700; color: var(--warn); background: var(--warn-bg); padding: 9px 11px; border-radius: 12px; text-align: center }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
select { font: 15px var(--sans); color: var(--fg); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 13px; padding: 12px; width: 100%; transition: border-color .2s }
select:focus, input:focus { border-color: var(--accent); outline: none }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--fg) }
.check input { width: 20px; height: 20px; accent-color: var(--accent) }
.btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* position cards */
.pos { display: grid; gap: 10px }
.pos-head { display: flex; align-items: center; gap: 10px }
.coin { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-weight: 800; font-size: 12px; letter-spacing: -.02em; flex: none;
  color: #fff; background: var(--cc, var(--grad)); box-shadow: 0 4px 12px color-mix(in srgb, var(--cc, #6355f0) 35%, transparent) }
.pos-name { font-weight: 800 } .pos-sub { font-size: 12px; color: var(--muted) }
.pos-pnl { margin-left: auto; text-align: right } .pos-pnl .a { font-weight: 800; font-size: 16px } .pos-pnl .p { font-size: 12px; font-weight: 700; display: inline-block; padding: 1px 7px; border-radius: 999px; margin-top: 2px }
.pos-pnl .p.up { background: var(--up-bg) } .pos-pnl .p.down { background: var(--down-bg) }
.risk { display: grid; gap: 6px; font-size: 12px; color: var(--muted) }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; transition: width .6s var(--ease) }
.row3 { display: flex; justify-content: space-between; gap: 8px }
.flash-up { animation: fu 1.1s ease-out } .flash-down { animation: fd 1.1s ease-out }
@keyframes fu { 0% { background: var(--up-bg); border-radius: 6px } 100% { background: transparent } }
@keyframes fd { 0% { background: var(--down-bg); border-radius: 6px } 100% { background: transparent } }

/* lists */
.list { background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow) }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); transition: transform .15s var(--ease), background .2s }
.item:last-child { border-bottom: 0 }
.item .main { min-width: 0; flex: 1 } .item .t { font-weight: 700 } .item .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.item .r { text-align: right; flex: none } .item .r .s { text-align: right }
.side { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 10px; font-weight: 800; flex: none; color: #fff }
.side.buy { background: var(--grad-up) } .side.sell { background: var(--grad-down) }
.empty { padding: 30px 16px; text-align: center; color: var(--muted) }
.empty::before { content: "🌙"; display: block; font-size: 30px; margin-bottom: 6px }

/* signals */
.sig { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line) }
.sig:last-child { border-bottom: 0 }
.dots { display: flex; gap: 4px }
.dots b { width: 10px; height: 10px; border-radius: 50%; background: #e3e6f2; transition: background .3s }
.dots b.on { background: #a9afc6 } .dots.go b.on { background: var(--grad) } .dots.held b.on { background: var(--grad-up) }
.tag { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px; letter-spacing: .02em }
.tag.go { background: var(--grad); color: #fff } .tag.held { background: var(--grad-up); color: #fff }

/* bot */
pre.log { margin: 0; font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; color: var(--muted); max-height: 340px; overflow: auto }
.note { font-size: 13px; color: var(--muted); line-height: 1.5 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--fg); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(17, 20, 39, .3) }
.toast.err { background: var(--grad-down) }
@media (prefers-reduced-motion: no-preference) { .toast:not([hidden]) { animation: pop .3s var(--ease) } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, 14px) scale(.96) } }

/* floating tab bar with a sliding highlight */
nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr);
  width: min(calc(100% - 24px), 520px); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.5) blur(18px); -webkit-backdrop-filter: saturate(1.5) blur(18px);
  border-radius: 24px; padding: 6px; box-shadow: 0 10px 30px rgba(30, 27, 75, .14), 0 0 0 1px rgba(30, 27, 75, .04) }
.tab { position: relative; z-index: 1; border: 0; background: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 7px 0; font: 700 10.5px var(--sans); cursor: pointer; border-radius: 18px; transition: color .25s, transform .15s var(--ease) }
.tab svg { width: 22px; height: 22px }
.tab[aria-selected="true"] { color: #fff }
.tab-ind { width: calc((100% - 12px) / 5); position: absolute; z-index: 0; top: 6px; bottom: 6px; left: 6px; border-radius: 18px; background: var(--grad); box-shadow: 0 6px 16px rgba(99, 85, 240, .35); transition: transform .35s var(--ease) }

/* sheet (confirm + settings) */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(17, 20, 39, .38); display: grid; align-items: end }
.sheet { background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; max-width: 720px; width: 100%; margin: 0 auto; max-height: 92vh; overflow: auto }
.sheet::before { content: ""; justify-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin-bottom: 4px }
.sheet h3 { margin: 0; font-size: 19px; font-weight: 800 } .sheet p { margin: 0; color: var(--muted) }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: up .32s var(--ease) } .scrim { animation: fadein .25s ease-out }
  .view.enter > * { animation: rise .45s var(--ease) both }
  .view.enter > *:nth-child(2) { animation-delay: .04s } .view.enter > *:nth-child(3) { animation-delay: .08s } .view.enter > *:nth-child(4) { animation-delay: .12s }
  .view.enter > *:nth-child(5) { animation-delay: .16s } .view.enter > *:nth-child(n+6) { animation-delay: .2s }
  .view.from-right > * { animation-name: inright } .view.from-left > * { animation-name: inleft }
}
@keyframes up { from { transform: translateY(100%) } }
@keyframes fadein { from { opacity: 0 } }
@keyframes rise { from { opacity: 0; transform: translateY(12px) } }
@keyframes inright { from { opacity: 0; transform: translateX(28px) } }
@keyframes inleft { from { opacity: 0; transform: translateX(-28px) } }
label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600 }
input { font: 15px var(--mono); color: var(--fg); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 13px; padding: 12px; width: 100%; transition: border-color .2s }
.skel { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; border-radius: 10px; animation: sh 1.2s linear infinite; color: transparent }
@keyframes sh { to { background-position: -200% 0 } }
</style>
</head>
<body>

<header class="top">
  <span class="brand">Tradebot</span>
  <button id="acct" class="acct" aria-label="Switch account"></button>
  <span id="status" class="status"><i></i><span>Connecting</span></span>
  <span class="spacer"></span>
  <button id="refresh" class="icon-btn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</header>

<main id="main"></main>

<nav class="tabs" role="tablist"><span class="tab-ind" id="tabind"></span>
  <button class="tab" data-tab="home" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Home</button>
  <button class="tab" data-tab="positions" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/></svg>Positions</button>
  <button class="tab" data-tab="trades" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4l-3 3M7 4l3 3"/><path d="M17 20V4M17 20l-3-3M17 20l3-3"/></svg>Trades</button>
  <button class="tab" data-tab="signals" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0 1 14 0M2 12a10 10 0 0 1 20 0"/></svg>Signals</button>
  <button class="tab" data-tab="bot" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V3M9 13h.01M15 13h.01"/></svg>Bot</button>
</nav>

<div class="ptr" id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></div>
<div id="overlay"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const S = {
    get(k) { try { return localStorage.getItem(k) } catch (e) { return null } },
    set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} },
  };
  // Two bots, one app: the OKX demo run by GitHub Actions, and the Binance
  // testnet run by the owner's VPS (deploy/vps/). Each keeps its own folder.
  const ACCOUNTS = {
    demo: { dir: "demo_state", name: "OKX demo", short: "OKX", gh: true },
    vps: { dir: "binance_state", name: "Binance testnet (VPS)", short: "VPS", gh: false },
    real: { dir: "binance_live", name: "Binance REAL (VPS)", short: "REAL", gh: false, real: true },
  };
  const WORKFLOW = "demo-bot.yml";
  let acct = ACCOUNTS[S.get("tb_acct")] ? S.get("tb_acct") : "demo", DIR = ACCOUNTS[acct].dir;
  let cfg = { token: S.get("tb_token"), repo: S.get("tb_repo") || "shuvojamal/binancebot" };
  let data = null, prices = {}, pausedSha = null, tab = S.get("tb_tab") || "home", loading = false;
  function loadCache() {
    data = null; prices = {}; pausedSha = null;
    try { const c = JSON.parse(S.get("tb_cache_" + acct) || "null"); if (c) { data = c.data; prices = c.prices || {}; pausedSha = c.pausedSha } } catch (e) {}
  }
  loadCache();

  // ---------- formatting ----------
  const nf = d => new Intl.NumberFormat("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  const F = [nf(0), nf(1), nf(2), nf(4)];
  const money = (n, d = 2) => n == null || isNaN(n) ? "–" : F[d].format(n);
  const sgn = (n, d = 2) => n == null || isNaN(n) ? "–" : (n >= 0 ? "+" : "−") + F[d].format(Math.abs(n));
  const pct = n => n == null || isNaN(n) ? "–" : (n >= 0 ? "+" : "−") + F[2].format(Math.abs(n * 100)) + "%";
  const px = n => n == null || isNaN(n) ? "–" : n >= 100 ? F[2].format(n) : n >= 1 ? F[3].format(n) : Number(n).toPrecision(4);
  const tone = n => n > 0 ? "up" : n < 0 ? "down" : "";
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const coin = s => (s || "").replace(/USDT$/, "");
  // A colour per coin (close to each brand), so lists are easy to scan; unknown coins get a stable hue.
  const COIN_C = { BTC: "#f7931a", ETH: "#627eea", BNB: "#e8b30b", SOL: "#9945ff", XRP: "#23292f", ADA: "#2a71d0", DOGE: "#c2a633",
    AVAX: "#e84142", LINK: "#2a5ada", NEAR: "#00c08b", PEPE: "#3d9a3a", SUI: "#4da2ff", TRX: "#ff060a", UNI: "#ff007a",
    PAXG: "#d4a72c", ZEC: "#e5a93d", LTC: "#345d9d", DOT: "#e6007a", OKX: "#6355f0", VPS: "#0ea5a4", REAL: "#f43f5e" };
  const cc = s => { const k = coin(s); if (COIN_C[k]) return COIN_C[k]; let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 70% 50%)` };
  const coinAv = s => `<div class="coin" style="--cc:${cc(s)}">${esc(coin(s).slice(0, 4))}</div>`;
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago" };
  const parseT = s => Date.parse(String(s || "").replace(" UTC", "Z").replace(" ", "T"));

  // ---------- GitHub + prices ----------
  async function gh(path, opts = {}) {
    const r = await fetch("https://api.github.com/repos/" + cfg.repo + path, {
      method: opts.method || "GET", body: opts.body, cache: "no-store",
      headers: { "Authorization": "Bearer " + cfg.token, "Accept": opts.accept || "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) },
    });
    if (r.status === 401) throw new Error("GitHub rejected the token. Open Bot → Settings and paste a new one.");
    if (r.status === 403) throw new Error("The token can't access " + cfg.repo + ". It needs Contents and Actions permission.");
    return r;
  }
  async function file(name, raw = true) {
    const r = await gh(`/contents/${DIR}/${name}?ref=main`, { accept: raw ? "application/vnd.github.raw+json" : undefined });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`Couldn't read ${name} (HTTP ${r.status}).`);
    return raw ? r.text() : r.json();
  }
  async function putFile(name, text, message) {
    const meta = await file(name, false);
    const body = { message, branch: "main", content: btoa(unescape(encodeURIComponent(text))) };
    if (meta) body.sha = meta.sha;
    const r = await gh(`/contents/${DIR}/${name}`, { method: "PUT", body: JSON.stringify(body) });
    if (!r.ok) throw new Error(`Couldn't save ${name} (HTTP ${r.status}).`);
  }
  async function dispatch(request) {
    if (!ACCOUNTS[acct].gh) {                       // the VPS checks for requests every 10 minutes
      if (!request) await putFile("RUN_NOW", "run requested from the app\n", "dashboard: run now (VPS)");
      setTimeout(load, 11 * 60000);
      return;
    }
    if (data && data.schedule && data.schedule !== "active") throw new Error("The daily schedule is stopped. Turn it on in the Bot tab first.");
    const r = await gh(`/actions/workflows/${WORKFLOW}/dispatches`, { method: "POST", body: JSON.stringify({ ref: "main" }) });
    if (r.status !== 204) throw new Error("Couldn't start a run (HTTP " + r.status + ").");
    setTimeout(load, 75000);
  }
  const maxOpen = () => +((data && data.settings.max_open) || 5);
  const DEFAULTS = () => ({ capital: (data && data.last.capital) || (ACCOUNTS[acct].real ? 300 : 5000), risk_pct: 1, max_open: 5, backstop_pct: 20, daily_loss_pct: 3,
                            max_drawdown_pct: 35, gold: true, rebuy_wait_days: 7, alert_pct: 20, min_score: 5 });
  const alertPct = () => +({ ...DEFAULTS(), ...((data && data.settings) || {}) }.alert_pct);
  const csv = t => { if (!t) return []; const [h, ...rows] = t.trim().split(/\r?\n/); const k = h.split(",");
    return rows.filter(Boolean).map(l => { const v = l.split(","); return Object.fromEntries(k.map((x, i) => [x, v[i]])) }) };

  async function load() {
    if (!cfg.token || loading) return;
    loading = true; $("refresh").classList.add("spin");
    try {
      const [state, trades, equity, report, last, log, paused, runs, fills, settings, closeReq, resetReq, shadow, wf, research] = await Promise.all([
        file("live_state.json"), file("live_trades.csv"), file("equity.csv"), file("report.txt"),
        file("last_run.json"), file("run.log"), file("PAUSED", false),
        ACCOUNTS[acct].gh ? gh(`/actions/workflows/${WORKFLOW}/runs?per_page=6`).then(r => r.ok ? r.json() : {}) : {},
        file("fills.csv"), file("settings.json"), file("CLOSE"), file("RESET_HALT", false), file("shadow.txt"),
        ACCOUNTS[acct].gh ? gh(`/actions/workflows/${WORKFLOW}`).then(r => r.ok ? r.json() : {}) : { state: "vps" },
        gh(`/contents/research/LATEST.md?ref=main`, { accept: "application/vnd.github.raw+json" }).then(r => r.ok ? r.text() : ""),
      ]);
      data = { state: state ? JSON.parse(state) : { positions: {} }, trades: csv(trades), equity: csv(equity),
               report: report || "", last: last ? JSON.parse(last) : {}, log: log || "", fills: csv(fills), shadow: shadow || "", research: research || "",
               settings: (() => { try { return JSON.parse(settings || "{}") } catch (e) { return {} } })(),
               closeReq: (closeReq || "").toUpperCase().split(/\s+/).filter(Boolean), resetPending: !!resetReq,
               schedule: wf.state || "active", runs: (runs.workflow_runs || []).map(r => ({
                 t: r.created_at, ev: r.event, st: r.status, c: r.conclusion, url: r.html_url })), loadedAt: Date.now() };
      if (!ACCOUNTS[acct].gh && data.last.time) data.runs = [{ t: parseT(data.last.time), ev: data.last.reason === "daily" ? "schedule" : "vps",
        st: "completed", c: data.last.ok === false ? "failure" : "success", url: `https://github.com/${cfg.repo}/commits/main/${DIR}` }];
      pausedSha = paused ? paused.sha : null;
      render();
      loadOverview().catch(() => {});
      await refreshPrices();
    } catch (e) { toast(e.message, true); setStatus("err", "Error") }
    finally { loading = false; $("refresh").classList.remove("spin") }
  }
  const held = () => Object.entries((data && data.state.positions) || {}).filter(([, p]) => p.qty > 0);
  async function refreshPrices() {
    const h = held(); if (!h.length) return;
    try {
      const r = await fetch("https://data-api.binance.vision/api/v3/ticker/price?symbols=" + encodeURIComponent(JSON.stringify(h.map(([s]) => s))));
      if (r.ok) for (const t of await r.json()) prices[t.symbol] = +t.price;
      prices._at = Date.now();
      S.set("tb_cache_" + acct, JSON.stringify({ data, prices, pausedSha }));
      if (tab === "home" || tab === "positions") render();
    } catch (e) {}
  }

  // ---------- numbers ----------
  function account() {
    const st = data.state, capital = data.last.capital || 5000, realised = st.realised || 0;
    let unreal = 0, ok = true;
    for (const [s, p] of held()) { if (prices[s] == null) ok = false; else unreal += (prices[s] - p.entry) * p.qty }
    const equity = capital + realised + unreal;
    const closed = data.trades.filter(r => r.side === "SELL" && r.pnl_usdt);
    const wins = closed.filter(r => +r.pnl_usdt > 0).length;
    return { capital, realised, unreal, ok, equity, pnl: equity - capital, closed: closed.length, wins };
  }

  // ---------- views ----------
  function setStatus(kind, text) { const s = $("status"); s.className = "status " + kind; s.lastElementChild.textContent = text }
  function statusFromData() {
    if (!data) return;
    const lastT = data.last.time ? parseT(data.last.time) : 0;
    if (ACCOUNTS[acct].real) {
      const m = realMode();
      return setStatus(m === "live" ? "halt" : m === "test" ? "pause" : "", m === "live" ? "REAL · LIVE" : m === "test" ? "REAL · no-orders test" : "REAL · off");
    }
    if (data.schedule === "vps" && (!lastT || Date.now() - lastT > 26 * 3600000)) setStatus("halt", lastT ? "VPS silent" : "Not set up");
    else if (data.schedule !== "vps" && data.schedule && data.schedule !== "active") setStatus("halt", "Stopped");
    else if (data.state.halted) setStatus("halt", "Breaker tripped");
    else if (pausedSha) setStatus("pause", "Paused");
    else setStatus("run", "Running");
  }

  let chartData = null;
  function chart(capital, live) {
    const pts = data.equity.map(r => ({ t: parseT(r.time), v: +r.equity })).filter(p => !isNaN(p.t) && !isNaN(p.v));
    pts.unshift({ t: pts.length ? pts[0].t - 86400000 : Date.now() - 86400000, v: capital });
    pts.push({ t: Date.now(), v: live });
    const W = 600, H = 140, vs = pts.map(p => p.v);
    let lo = Math.min(...vs), hi = Math.max(...vs); const span = Math.max(hi - lo, capital * .01); lo -= span * .15; hi += span * .15;
    const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    const x = t => (t - t0) / Math.max(1, t1 - t0) * W, y = v => H - (v - lo) / (hi - lo) * H;
    const d = pts.map((p, i) => (i ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
    const c = live >= capital ? "var(--up)" : "var(--down)", e = pts[pts.length - 1];
    chartData = { pts, x, y, W, t0, t1 };
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Equity history">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" x2="${W}" y1="${y(capital)}" y2="${y(capital)}" stroke="var(--line)" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/>
      <path d="${d} L ${W} ${H} L 0 ${H} Z" fill="url(#g)"/>
      <path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <path d="M ${x(e.t)} ${y(e.v)} l .01 0" stroke="${c}" stroke-width="11" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
  }

  function alertBanner() {
    const a = alertPct(); if (!a) return "";
    const up = held().filter(([s, p]) => prices[s] != null && prices[s] / p.entry - 1 >= a / 100);
    if (!up.length) return "";
    return `<div class="pending" style="color:var(--up);background:var(--up-bg);font-size:13px" data-goto="positions">
      Profit alert: ${up.map(([s, p]) => `${esc(coin(s))} ${pct(prices[s] / p.entry - 1)}`).join(", ")}. Tap to review.</div>`;
  }

  function vHome() {
    const a = account();
    const pauseBtn = pausedSha
      ? `<button class="btn primary" data-act="resume">${I.play}Resume</button>`
      : `<button class="btn warn" data-act="pause">${I.pause}Pause</button>`;
    const last = data.last.time ? parseT(data.last.time) : null;
    return `
      <div class="card hero">
        <div class="label">Bot balance · USDT</div>
        <div class="big num" id="bigbal" data-v="${a.equity}">${money(lastBal ?? a.equity)}</div>
        <div class="delta"><span class="badge ${tone(a.pnl)} num">${pct(a.pnl / a.capital)}</span><span class="${tone(a.pnl)} num">${sgn(a.pnl)} USDT</span><span class="muted">all time</span></div>
        <div class="chart" id="chart">${chart(a.capital, a.equity)}<div class="scrub" id="scrub" hidden><i></i><b></b></div></div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Open P&amp;L</div><div class="v num ${tone(a.unreal)}">${a.ok ? sgn(a.unreal) : "…"}</div></div>
        <div class="stat"><div class="k">Realised</div><div class="v num ${tone(a.realised)}">${sgn(a.realised)}</div></div>
        <div class="stat"><div class="k">Win rate</div><div class="v num">${a.closed ? Math.round(a.wins / a.closed * 100) + "%" : "–"}</div></div>
      </div>
      ${alertBanner()}
      <div class="actions">${pauseBtn}<button class="btn" data-act="run">${I.bolt}Run now</button></div>
      <h2>Open positions · ${held().length} of ${maxOpen()}</h2>
      ${posCards(3)}
      ${held().length > 3 ? `<button class="btn" data-goto="positions">See all positions</button>` : ""}
      <h2>All accounts</h2><div id="overview">${overviewHtml()}</div>
      <div class="note">Prices live from Binance${prices._at ? " · updated " + ago(prices._at) : ""}. The bot trades once a day at 6:07 am (Bangladesh)${last ? " · last run " + ago(last) : ""}.${data.state.halted ? " Circuit breaker: " + esc(data.state.halted) : ""}</div>`;
  }

  // ---------- all accounts side by side (the 90-day comparison) ----------
  let overview = null, overviewAt = 0;
  async function loadOverview() {
    if (overview && Date.now() - overviewAt < 120000) return;
    const raw = (dir, name) => gh(`/contents/${dir}/${name}?ref=main`, { accept: "application/vnd.github.raw+json" }).then(r => r.ok ? r.text() : "");
    overview = await Promise.all(Object.entries(ACCOUNTS).map(async ([k, a]) => {
      const [eq, st, set, last] = await Promise.all([raw(a.dir, "equity.csv"), raw(a.dir, "live_state.json"), raw(a.dir, "settings.json"), raw(a.dir, "last_run.json")]);
      const rows = csv(eq), J = t => { try { return JSON.parse(t || "{}") } catch (e) { return {} } };
      const state = J(st), settings = J(set), lastRun = J(last);
      // the capital the last run used, so its equity is compared like with like
      const capital = +(lastRun.capital || settings.capital || (a.real ? 300 : 5000));
      const open = Object.values(state.positions || {}).filter(p => p.qty > 0).length;
      return { k, a, has: !!(rows.length || st), equity: rows.length ? +rows[rows.length - 1].equity : null, capital,
               realised: +(state.realised || 0), open, score: +(settings.min_score || 5), mode: settings.mode,
               last: lastRun.time ? parseT(lastRun.time) : 0 };
    }));
    overviewAt = Date.now();
    const el = $("overview");
    if (el) { const t = document.createElement("div"); t.id = "overview"; t.innerHTML = overviewHtml(); morph(el, t) }
  }
  function overviewHtml() {
    if (!overview) { loadOverview().catch(() => {}); return `<div class="list"><div class="item skel" style="height:210px"></div></div><div class="note">&nbsp;</div>`; }
    return `<div class="list">${overview.map(o => {
      const pnl = o.equity != null ? o.equity - o.capital : null;
      const tag = o.a.real ? (o.mode === "live" ? "LIVE" : o.mode === "test" ? "no-orders test" : "off") : "test money";
      return `<div class="item" data-acct-go="${o.k}" style="cursor:pointer">${coinAv(o.a.short)}
        <div class="main"><div class="t">${esc(o.a.name)}</div>
          <div class="s">${o.has ? `${o.open} open · ${o.score} of 8 checks · ${tag}${o.last ? " · ran " + ago(o.last) : ""}` : "not set up yet"}</div></div>
        <div class="r"><div class="t num ${tone(pnl)}">${o.equity != null ? money(o.equity, 0) : "–"}</div>
          <div class="s num ${tone(pnl)}">${pnl != null ? pct(pnl / o.capital) : ""}</div></div></div>`;
    }).join("")}</div><div class="note">Balance at each bot's last run (live prices only for the account you're viewing). Tap a row to open that account.</div>`;
  }

  // What the current stop already protects: selling at the stop keeps (stop - entry) x qty, before fees.
  function lockLine(p) {
    const lock = (p.stop - p.entry) * p.qty;
    return lock > 0
      ? `<div class="num" style="font-size:12px;color:var(--up);font-weight:600">Stop is above your entry: at least ${sgn(lock)} USDT locked in</div>`
      : `<div class="num" style="font-size:12px">If the stop is hit: ${sgn(lock)} USDT (the trade's risk)</div>`;
  }

  const lastPnl = {};
  function posCards(limit) {
    const h = held();
    if (!h.length) return `<div class="card empty">No open positions. The bot is waiting for a signal.</div>`;
    return h.slice(0, limit || 99).map(([s, p]) => {
      const now = prices[s], pnl = now != null ? (now - p.entry) * p.qty : null, r = now != null ? now / p.entry - 1 : null;
      // bar: how much room is left between price and stop, relative to the initial risk
      const room = now != null ? Math.max(0, Math.min(1, (now - p.stop) / Math.max(1e-12, p.entry - p.stop) / 2)) : .5;
      const toStop = now != null ? (now - p.stop) / now : null;
      const col = room < .2 ? "var(--grad-down)" : room < .45 ? "linear-gradient(90deg,#ffb020,#ff8a00)" : "var(--grad-up)";
      const prev = lastPnl[s]; lastPnl[s] = pnl;
      const flash = prev != null && pnl != null && Math.abs(pnl - prev) > 1e-9 ? (pnl > prev ? "flash-up" : "flash-down") : "";
      return `<div class="card pos">
        <div class="pos-head">${coinAv(s)}
          <div><div class="pos-name">${esc(coin(s))}</div><div class="pos-sub num">${money(p.entry * p.qty)} USDT · entry ${px(p.entry)}</div></div>
          <div class="pos-pnl"><div class="a num ${tone(pnl)} ${flash}">${sgn(pnl)}</div><div class="p num ${tone(r)}">${pct(r)}</div></div></div>
        <div class="risk"><div class="track"><div class="fill" style="width:${(room * 100).toFixed(0)}%;background:${col}"></div></div>
          <div class="row3 num"><span>Stop ${px(p.stop)}</span><span>${toStop == null ? "" : F[1].format(toStop * 100) + "% above stop"}</span><span>Now ${px(now)}</span></div>
          ${lockLine(p)}
          ${p.backstop_px ? `<div class="num" style="font-size:12px">Emergency backstop on the exchange at ${px(p.backstop_px)}</div>` : ""}</div>
        ${alertPct() && r != null && r >= alertPct() / 100 ? `<div class="pending" style="color:var(--up);background:var(--up-bg)">Up ${pct(r)}: your +${alertPct()}% alert. Sell now to take it, or let the trailing stop keep riding.</div>` : ""}
        ${data.closeReq.includes(s) || data.closeReq.includes("ALL")
          ? `<div class="pending">Sell requested · happens in the next run</div>`
          : `<div class="actions"><button class="btn sm" data-act="chart" data-sym="${esc(s)}">${I.chart}Chart</button><button class="btn danger sm" data-act="sell" data-sym="${esc(s)}">Sell ${esc(coin(s))} now</button></div>`}
      </div>`;
    }).join("");
  }

  function vPositions() {
    return `<h2>Open positions · ${held().length} of ${maxOpen()}</h2>${posCards()}
      ${held().length > 1 && !data.closeReq.includes("ALL") ? `<button class="btn danger" data-act="sellall">Sell all positions now</button>` : ""}
      <div class="note">The bar shows how far the price is above its stop-loss. Green is comfortable, amber is getting close, red is near the stop. Stops rise automatically as prices go up and never move down. The stop is checked once a day at the close; the emergency backstop is a real order resting on OKX 20% lower, which only fires in a crash or if the bot can't run.</div>`;
  }

  // Closed round trips: each SELL matched to the BUY of the same coin before it.
  function roundTrips() {
    const open = {}, out = [];
    for (const r of data.trades) {
      if (r.side === "BUY") open[r.symbol] = r;
      else if (r.side === "SELL" && open[r.symbol]) {
        const b = open[r.symbol]; delete open[r.symbol];
        out.push({ sym: r.symbol, pnl: +r.pnl_usdt || 0, ret: +r.price / +b.price - 1, why: r.reason,
                   days: (parseT(r.time) - parseT(b.time)) / 86400000, month: (r.time || "").slice(0, 7) });
      }
    }
    return out;
  }
  function perfCard() {
    const rt = roundTrips();
    if (!rt.length) return `<div class="card note"><b>Performance</b> appears once the first position closes.
      The backtest's expectation to compare against: about 1 in 3 trades wins, winners are about 3.5&times; the size of losers,
      profit factor about 1.9, and roughly 1 to 2 closed trades a month.</div>`;
    const wins = rt.filter(x => x.pnl > 0), losses = rt.filter(x => x.pnl <= 0);
    const gw = wins.reduce((a, x) => a + x.pnl, 0), gl = -losses.reduce((a, x) => a + x.pnl, 0);
    const avg = xs => xs.length ? xs.reduce((a, x) => a + x.ret, 0) / xs.length : null;
    const months = {};
    for (const x of rt) months[x.month] = (months[x.month] || 0) + x.pnl;
    const best = rt.reduce((a, x) => x.pnl > a.pnl ? x : a), worst = rt.reduce((a, x) => x.pnl < a.pnl ? x : a);
    const stat = (k, v, cls = "") => `<div class="stat"><div class="k">${k}</div><div class="v num ${cls}">${v}</div></div>`;
    return `<div class="stats">
        ${stat("Closed trades", rt.length)}
        ${stat("Win rate", Math.round(wins.length / rt.length * 100) + "%")}
        ${stat("Profit factor", gl ? (gw / gl).toFixed(2) : "–", gl && gw / gl >= 1 ? "up" : "down")}
      </div>
      <div class="stats">
        ${stat("Avg win", wins.length ? pct(avg(wins)) : "–", "up")}
        ${stat("Avg loss", losses.length ? pct(avg(losses)) : "–", "down")}
        ${stat("Avg hold", (rt.reduce((a, x) => a + x.days, 0) / rt.length).toFixed(0) + " d")}
      </div>
      <div class="list">${Object.entries(months).sort().reverse().map(([m, v]) => `<div class="item"><div class="main"><div class="t">${m}</div></div>
        <div class="r"><div class="t num ${tone(v)}">${sgn(v)}</div><div class="s">realised</div></div></div>`).join("")}</div>
      <div class="note">Best ${esc(coin(best.sym))} ${sgn(best.pnl)}, worst ${esc(coin(worst.sym))} ${sgn(worst.pnl)}.
        Backtest expectation: about 1 in 3 trades wins, profit factor about 1.9. With fewer than 30 closed trades, these numbers are mostly luck.</div>`;
  }

  function vTrades() {
    const t = data.trades.slice().reverse();
    if (!t.length) return `<h2>Performance</h2>${perfCard()}<div class="card empty">No trades yet.</div>`;
    return `<h2>Performance</h2>${perfCard()}<h2>${t.length} trades</h2><div class="list">${t.map(r => {
      const sell = r.side === "SELL", pnl = r.pnl_usdt ? +r.pnl_usdt : null, val = +r.qty * +r.price;
      const why = (r.reason || "").includes("+") ? (r.reason.split("+").length + " of 8 checks") : (r.reason || "").replace("_", " ");
      return `<div class="item"><div class="side ${sell ? "sell" : "buy"}">${sell ? "SELL" : "BUY"}</div>
        <div class="main"><div class="t">${esc(coin(r.symbol))} <span class="muted num" style="font-weight:400">@ ${px(+r.price)}</span></div>
        <div class="s">${esc((r.time || "").replace(" UTC", ""))} · ${esc(why)}</div></div>
        <div class="r"><div class="t num ${tone(pnl)}">${pnl == null ? money(val) : sgn(pnl)}</div><div class="s">${pnl == null ? "USDT" : "P&amp;L"}</div></div></div>`;
    }).join("")}</div>`;

  function vSignals() {

  // 90 daily closes from Binance with entry, stop and backstop drawn across
  async function openChart(sym) {
    const p = data.state.positions[sym];
    sheet(`<h3>${esc(coin(sym))} · last 90 days</h3><div id="chartbox" class="chart" style="height:220px"><div class="skel" style="height:100%"></div></div><div id="chartnote" class="note"></div>

    try {
      const r = await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${encodeURIComponent(sym)}&interval=1d&limit=90`);
      const k = (await r.json()).map(x => ({ t: x[0], c: +x[4] }));
      const now = prices[sym] || k[k.length - 1].c;
      const levels = [["Entry", p.entry, "var(--accent)", ""], ["Stop", p.stop, "var(--down)", ""]];
      if (p.backstop_px) levels.push(["Backstop", p.backstop_px, "var(--down)", "4 4"]);
      const vals = k.map(x => x.c).concat(levels.map(l => l[1]), [now]);
      let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .08; lo -= pad; hi += pad;
      const W = 600, Hh = 220, x = i => i / (k.length - 1) * W, y = v => Hh - (v - lo) / (hi - lo) * Hh;
      const path = k.map((q, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(q.c).toFixed(1)).join(" ");

      $("chartbox").innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" aria-label="${esc(coin(sym))} price">${lines}
        <path d="${path}" fill="none" stroke="var(--fg)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <circle cx="${W}" cy="${y(now)}" r="5" fill="${now >= p.entry ? "var(--up)" : "var(--down)"}"/></svg>`;
      $("chartnote").innerHTML = `Now ${px(now)} (${pct(now / p.entry - 1)} from entry). The stop follows the highest close minus 3 × the average daily range, and never moves down.`;

  }

  const VIEWS = { home: vHome, positions: vPositions, trades: vTrades, signals: vSignals, bot: vBot };

  // Minimal DOM patcher: makes `a` look like `b`, touching only what differs.
  function morph(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return }
    if (a.nodeType === 3 || a.nodeType === 8) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return }
    if (a.nodeType !== 1) return;
    if (a.id === "scrub") return;                                   // owned by the chart touch handler
    if (a.classList.contains("view")) a.className = "view";         // keep it, but no entrance replay
    else {
      for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
      for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    }
    if (a.id === "bigbal") return;                                  // count-up animates the text itself
    const ac = [...a.childNodes], bc = [...b.childNodes];
    for (let i = 0; i < bc.length; i++) { if (i < ac.length) morph(ac[i], bc[i]); else a.appendChild(bc[i]) }
    for (let i = bc.length; i < ac.length; i++) ac[i].remove();
  }
  function countUp() {
    const el = $("bigbal"); if (!el) return;
    const to = +el.dataset.v, from = lastBal ?? to; lastBal = to;
    if (Math.abs(to - from) < .005 || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = money(to); return }
    const t0 = performance.now(), dur = 700;
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      if (el.isConnected) el.textContent = money(from + (to - from) * e); if (k < 1) requestAnimationFrame(step) };
    requestAnimationFrame(step);
  }
  function bindChart() {
    const box = $("chart"), sc = $("scrub"); if (!box || !chartData) return;

      const r = box.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      const t = chartData.t0 + f * (chartData.t1 - chartData.t0);
      const p = chartData.pts.reduce((a, q) => Math.abs(q.t - t) < Math.abs(a.t - t) ? q : a);
      const xf = chartData.x(p.t) / chartData.W;
      sc.hidden = false; sc.style.left = (xf * 100) + "%";
      sc.querySelector("i").style.top = (chartData.y(p.v) / 140 * 100) + "%";

    };
    box.onpointerdown = e => { show(e); buzz(4) };
    box.onpointermove = e => { if (e.pointerType === "mouse" || e.buttons) show(e) };
    box.onpointerleave = box.onpointerup = box.onpointercancel = () => setTimeout(() => { sc.hidden = true }, 900);

      <label for="f-token">GitHub token<input id="f-token" type="password" autocomplete="off" placeholder="github_pat_…" value="${esc(cfg.token || "")}"></label>
      <label for="f-repo">Repository<input id="f-repo" value="${esc(cfg.repo)}"></label>
      <div class="actions">${first ? "" : `<button class="btn" id="no">Cancel</button>`}<button class="btn primary" id="save" style="${first ? "grid-column:1/-1" : ""}">${first ? "Connect" : "Save"}</button></div>`);
    if (!first) $("no").onclick = close; else $("scrim").onclick = null;
    $("save").onclick = () => {
      const t = $("f-token").value.trim(); if (!t) return toast("Paste your token first.", true);
      cfg = { token: t, repo: $("f-repo").value.trim() || cfg.repo }; S.set("tb_token", cfg.token); S.set("tb_repo", cfg.repo);
      close(); data = null; render(); load();
    };
  }
  let toastT;
  function toast(text, err) { const t = $("toast"); t.textContent = text; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true }, err ? 5000 : 2600) }

  const ACTS = {
    pause: () => confirmSheet("Pause new trades?", "The bot stops opening positions. Stop-losses keep protecting the ones you hold.", "Pause", "warn", async () => {
      const r = await gh(`/contents/${DIR}/PAUSED`, { method: "PUT", body: JSON.stringify({ message: "dashboard: pause new entries", branch: "main",
        content: btoa("Paused from the app at " + new Date().toISOString() + "\n") }) });
      if (!r.ok) throw new Error("Pause failed (HTTP " + r.status + ").");
      pausedSha = (await r.json()).content.sha; render(); toast("Paused. Takes effect at the next run.");
    }),
    resume: () => confirmSheet("Resume trading?", "The bot will open new positions again when it sees signals.", "Resume", "primary", async () => {
      const r = await gh(`/contents/${DIR}/PAUSED`, { method: "DELETE", body: JSON.stringify({ message: "dashboard: resume", sha: pausedSha, branch: "main" }) });
      if (!r.ok) throw new Error("Resume failed (HTTP " + r.status + ").");
      pausedSha = null; render(); toast("Resumed.");
    }),
    run: () => confirmSheet("Run the bot now?", ACCOUNTS[acct].gh
        ? "It checks every coin on the OKX demo account and acts on any signals or stops. Takes about a minute."
        : "Your VPS picks this up within 10 minutes, checks every coin on the Binance testnet and acts on any signals or stops.", "Run now", "primary", async () => {
      await dispatch(); toast(ACCOUNTS[acct].gh ? "Run started. Results in about a minute." : "Requested. The VPS runs it within 10 minutes.");
    }),
    settings: () => openSettings(false),
    strategy: () => openStrategy(),
    chart: el => openChart(el.dataset.sym),
    realmode: el => {
      const mode = el.dataset.mode;
      const save = async (extra) => {
        const st = { ...data.settings, mode, ...extra };
        if (mode !== "live") delete st.confirm;
        await putFile("settings.json", JSON.stringify(st, null, 2) + "\n", `dashboard: real account ${mode}`);
        data.settings = st; await dispatch(); render();
      };
      if (mode === "off") return confirmSheet("Switch the real account off?", "The bot stops all activity on your real account. Open positions stay open on Binance; sell them first with Sell all if you want to close them. USDT in Flexible Savings stays there earning interest; withdraw it in the Binance app, or use Sell all + Off.",
        "Switch off", "primary", async () => { await save({}); toast("Real account off.") });
      if (mode === "test") return confirmSheet("Start the no-orders test?", "Within 10 minutes your VPS reads your real balance with the real keys and shows what the bot would buy. It places no orders.",
        "Start test", "primary", async () => { await save({}); toast("No-orders test requested. Check back in 10 minutes.") });
      sheet(`<h3 style="color:var(--down)">Trade real money?</h3>
        <p>The bot will place real orders on your Binance account with the capital set below (Edit settings). You can lose money: the backtest had drops of up to about 40% and losing years. Did the no-orders test look right?</p>
        <label><span>Type <b>${CONFIRM}</b> to confirm</span><input id="r-confirm" autocomplete="off" placeholder="${CONFIRM}"></label>
        <div class="actions"><button class="btn" id="no">Cancel</button><button class="btn danger" id="yes">Go live</button></div>`);
      $("no").onclick = close;
      $("yes").onclick = async () => {
        if ($("r-confirm").value.trim() !== CONFIRM) return toast("Type the confirmation exactly.", true);
        $("yes").disabled = true;
        try { await save({ confirm: CONFIRM }); close(); toast("Real trading switched on. The VPS picks it up within 10 minutes.") } catch (e) { close(); toast(e.message, true) }
      };
    },
    savings: () => {
      const on = !!(data.settings || {}).savings;
      confirmSheet(on ? "Turn auto savings off?" : "Turn auto savings on?", on
        ? "On the next run the bot moves the USDT it put into Flexible Savings back to your spot wallet. Savings you made yourself are not touched."
        : "After each run the bot moves spare USDT from your spot wallet into Binance Flexible Savings, and takes out what a buy needs just before buying. Flexible savings can be withdrawn at any time; the rate changes daily. Only works in live mode (the no-orders test just shows what it would move). Your API key needs Spot trading permission.",
        on ? "Turn off" : "Turn on", "primary", async () => {
          const st = { ...data.settings, savings: !on };
          await putFile("settings.json", JSON.stringify(st, null, 2) + "\n", `dashboard: auto savings ${on ? "off" : "on"}`);
          data.settings = st; await dispatch(); render(); toast(on ? "Auto savings off from the next run." : "Auto savings on from the next run.") });
    },
    realstop: () => confirmSheet("Sell everything and switch off?", "Every position on your real account is sold at market in the next VPS pass (within 10 minutes), the USDT the bot put into savings goes back to your spot wallet, then the bot stops trading the real account.",
      "Sell all + Off", "danger", async () => {
        // stays live for this one pass so the sale can happen; the VPS switches it off afterwards
        const st = { ...data.settings, stop_after_close: true, savings: false };
        await putFile("settings.json", JSON.stringify(st, null, 2) + "\n", "dashboard: real account sell all then off");
        await putFile("CLOSE", "ALL\n", "dashboard: real account sell all");
        data.settings = st; data.closeReq = ["ALL"]; render(); toast("Selling everything on the next pass, then switching off.") }),
    sell: el => { const s = el.dataset.sym; confirmSheet(`Sell ${esc(coin(s))} now?`,
      "It sells at the market price in a run that starts now (about a minute), which locks in the current profit or loss. The bot won't buy it back for 7 days.",
      "Sell now", "danger", async () => {
        await putFile("CLOSE", [...new Set([...data.closeReq, s])].join("\n") + "\n", `dashboard: sell ${s}`);
        data.closeReq = [...new Set([...data.closeReq, s])]; await dispatch(true); render(); toast(`Selling ${coin(s)}… results in about a minute.`) }) },
    sellall: () => confirmSheet("Sell every position now?", "Everything is sold at market price in a run that starts now. None of these coins will be bought back for 7 days. To also stop new buys, press Pause.",
      "Sell all", "danger", async () => {
        await putFile("CLOSE", "ALL\n", "dashboard: sell all"); data.closeReq = ["ALL"]; await dispatch(true); render(); toast("Selling everything… results in about a minute.") }),
    resethalt: () => confirmSheet("Reset the circuit breaker?", "Only do this after you've looked at why the account fell this far. The bot can open new positions again from the run that starts now.",
      "Reset", "warn", async () => { await putFile("RESET_HALT", "reset from the app\n", "dashboard: reset circuit breaker"); data.resetPending = true; await dispatch(true); render(); toast("Reset requested.") }),
    schedule: () => data.schedule === "active"
      ? confirmSheet("Stop the daily bot?", "The bot stops running completely: no stop-loss checks, no new trades, and Run now and Sell won't work until you start it again. Open positions stay open, protected only by the emergency backstops on OKX. To just stop new buys, use Pause instead.",
          "Stop bot", "danger", async () => {
            const r = await gh(`/actions/workflows/${WORKFLOW}/disable`, { method: "PUT" });
            if (r.status !== 204) throw new Error("Couldn't stop the schedule (HTTP " + r.status + ").");
            data.schedule = "disabled_manually"; render(); toast("Daily bot stopped.") })
      : confirmSheet("Start the daily bot again?", "It runs every day after the daily close and checks stops on all open positions.", "Start", "primary", async () => {
            const r = await gh(`/actions/workflows/${WORKFLOW}/enable`, { method: "PUT" });
            if (r.status !== 204) throw new Error("Couldn't start the schedule (HTTP " + r.status + ").");
            data.schedule = "active"; render(); toast("Daily bot started.") }),
  };
  document.addEventListener("pointerdown", e => {
    const b = e.target.closest(".btn"); if (!b) return;
    const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), sp = document.createElement("span");
    sp.className = "rip"; sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
    b.appendChild(sp); setTimeout(() => sp.remove(), 520);
  });
  const goTab = t => { if (t === tab) return; tab = t; S.set("tb_tab", tab); buzz(6); scrollTo(0, 0); render() };
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-act]"); if (a) { buzz(8); return ACTS[a.dataset.act](a) }
    const ag = e.target.closest("[data-acct-go]");
    if (ag && ag.dataset.acctGo !== acct) { acct = ag.dataset.acctGo; DIR = ACCOUNTS[acct].dir; S.set("tb_acct", acct); chip(); loadCache(); render(); load(); return }
    const g = e.target.closest("[data-goto]"); if (g) goTab(g.dataset.goto);
    const t = e.target.closest(".tab"); if (t) goTab(t.dataset.tab);
  });
  $("refresh").onclick = () => { buzz(6); load() };
  let tx = null, ty = 0, pull = 0;
  const main = $("main"), ptr = $("ptr");
  main.addEventListener("touchstart", e => {
    if ($("overlay").innerHTML || e.target.closest(".chart, pre, input, select")) { tx = null; return }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; pull = 0;
  }, { passive: true });
  main.addEventListener("touchmove", e => {
    if (tx == null) return;
    const dy = e.touches[0].clientY - ty, dx = e.touches[0].clientX - tx;
    if (scrollY <= 0 && dy > 0 && Math.abs(dy) > Math.abs(dx)) {
      pull = Math.min(110, dy * .5);
      ptr.style.opacity = Math.min(1, pull / 60); ptr.style.transform = `translateY(${pull - 30}px) rotate(${pull * 3}deg) scale(${.6 + Math.min(.4, pull / 150)})`;
    }
  }, { passive: true });
  main.addEventListener("touchend", e => {
    if (tx == null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (pull >= 60) { buzz(10); ptr.classList.add("spin"); load().finally(() => { ptr.classList.remove("spin") }) }
    ptr.style.transition = "transform .3s var(--ease), opacity .3s"; ptr.style.opacity = 0; ptr.style.transform = "";
    setTimeout(() => { ptr.style.transition = "" }, 300);
    if (pull < 10 && Math.abs(dx) > 70 && Math.abs(dy) < 50) {
      const i = TABS.indexOf(tab) + (dx < 0 ? 1 : -1);
      if (i >= 0 && i < TABS.length) goTab(TABS[i]);
    }
    tx = null; pull = 0;
  });
  const chip = () => { $("acct").textContent = ACCOUNTS[acct].short; $("acct").classList.toggle("real", !!ACCOUNTS[acct].real) };
  chip();
  $("acct").onclick = () => {
    sheet(`<h3>Account</h3>${Object.entries(ACCOUNTS).map(([k, a]) => `<button class="choice" data-acct="${k}" aria-current="${k === acct}">
      ${coinAv(a.short)}<div><div style="font-weight:700">${a.name}</div>
      <div class="muted" style="font-size:12px">${a.real ? "Runs on your VPS · REAL MONEY · off until you switch it on" : a.gh ? "Runs on GitHub every day · test money" : "Runs on your VPS (Germany) · test money"}</div></div></button>`).join("")}`);
    for (const b of document.querySelectorAll("[data-acct]")) b.onclick = () => {
      acct = b.dataset.acct; DIR = ACCOUNTS[acct].dir; S.set("tb_acct", acct); chip();
      close(); loadCache(); render(); load();
    };
  };
  document.addEventListener("visibilitychange", () => { if (!document.hidden && data && Date.now() - (data.loadedAt || 0) > 60000) load() });

  const I = {
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
    bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  };

  render();           // instant: cached data from the last visit
  load();             // then fresh data in the background
  setInterval(refreshPrices, 15000);
})();
</script>
</body>
</html>
